<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1030" width="390" height="1030" role="img" aria-label="Recall, work, verify, refine, and a reviewed repository change form a local loop. A separate human-approved sync can carry generic changes into future repositories.">
<title>Harness Firmware feedback circuit</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}.ink{fill:#f0f6fc}.mute{fill:#9198a1}.accent{fill:#3fb950}.soft{fill:#12261e}.panel{fill:none;stroke:#3d444d;stroke-width:1}.wire{fill:none;stroke:#3d444d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wire.active{stroke:#3fb950}.dash{stroke-dasharray:7 7}.tag{fill:#12261e;stroke:#3fb950;stroke-width:1}.cell{fill:none;stroke:#3d444d;stroke-width:1}.grid{stroke:#3d444d;stroke-width:1;opacity:.28}.signal{fill:#3fb950;stroke:#3fb950}.evidence{fill:#12261e;stroke:#f0f6fc;stroke-width:1}.eyebrow{font:600 12px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.8px}.headline{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:-1.5px}.subhead{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.label{font:700 13px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.7px}.copy{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.small{font:500 12px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.25px}.count{font:700 34px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes scanY{0%{transform:translateY(0)}92%,100%{transform:translateY(var(--scan-distance))}}
.eyebrow{font-size:14px}.subhead{font-size:20px}.label{font-size:15px}.copy{font-size:15px}.small{font-size:14px;letter-spacing:.15px}
@keyframes feedbackPulse{0.00%,15.67%{transform:translate(108px,186px)}16.67%,32.33%{transform:translate(282px,186px)}33.33%,49.00%{transform:translate(282px,312px)}50.00%,65.67%{transform:translate(108px,312px)}66.67%,82.33%{transform:translate(108px,438px)}83.33%,99.00%{transform:translate(282px,438px)}}.feedback-pulse{animation:feedbackPulse 12s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.feedback-pulse,.scan-bar,.boot-cursor,.runtime-packet{display:none!important}.boot-ready{opacity:1!important}}
</style>
<g aria-hidden="true"><path class="grid" d="M44 0V1030"/><path class="grid" d="M88 0V1030"/><path class="grid" d="M132 0V1030"/><path class="grid" d="M176 0V1030"/><path class="grid" d="M220 0V1030"/><path class="grid" d="M264 0V1030"/><path class="grid" d="M308 0V1030"/><path class="grid" d="M352 0V1030"/><path class="grid" d="M0 44H390"/><path class="grid" d="M0 88H390"/><path class="grid" d="M0 132H390"/><path class="grid" d="M0 176H390"/><path class="grid" d="M0 220H390"/><path class="grid" d="M0 264H390"/><path class="grid" d="M0 308H390"/><path class="grid" d="M0 352H390"/><path class="grid" d="M0 396H390"/><path class="grid" d="M0 440H390"/><path class="grid" d="M0 484H390"/><path class="grid" d="M0 528H390"/><path class="grid" d="M0 572H390"/><path class="grid" d="M0 616H390"/><path class="grid" d="M0 660H390"/><path class="grid" d="M0 704H390"/><path class="grid" d="M0 748H390"/><path class="grid" d="M0 792H390"/><path class="grid" d="M0 836H390"/><path class="grid" d="M0 880H390"/><path class="grid" d="M0 924H390"/><path class="grid" d="M0 968H390"/><path class="grid" d="M0 1012H390"/></g><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3d444d"/></marker></defs><text class="eyebrow mute" x="24" y="34">THE FEEDBACK CIRCUIT</text><text class="subhead" x="24" y="70">Verified lessons improve</text><text class="subhead" x="24" y="96">the next task.</text><path class="wire" marker-end="url(#arrow)" d="M108 186H273"/><path class="wire" marker-end="url(#arrow)" d="M282 186V312H273"/><path class="wire" marker-end="url(#arrow)" d="M282 312H99"/><path class="wire" marker-end="url(#arrow)" d="M108 312V438H99"/><path class="wire" marker-end="url(#arrow)" d="M108 438H273"/><path class="wire" marker-end="url(#arrow)" d="M282 438H376V122H108V178"/><g transform="translate(24 142)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">01</text><text class="label" x="14" y="43">RECALL</text><text class="copy mute" x="14" y="68">load repo facts</text></g><g transform="translate(198 142)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">02</text><text class="label" x="14" y="43">WORK</text><text class="copy mute" x="14" y="68">use routed playbook</text></g><g transform="translate(198 268)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">03</text><text class="label" x="14" y="43">VERIFY</text><text class="copy mute" x="14" y="68">capture evidence</text></g><g transform="translate(24 268)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">04</text><text class="label" x="14" y="43">REFINE</text><text class="copy mute" x="14" y="68">turn friction into a fix</text></g><g transform="translate(24 394)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">05</text><text class="label" x="14" y="43">REVIEWED CHANGE</text><text class="copy mute" x="14" y="68">commit useful lesson</text></g><g transform="translate(198 394)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">06</text><text class="label" x="14" y="43">NEXT TASK</text><text class="copy mute" x="14" y="68">recall stronger repo</text></g><g transform="translate(238 236)"><rect class="evidence" width="112" height="28"/><path class="wire active" d="M10 14l7 7 13-15"/><text class="small" x="38" y="19">EVIDENCE</text></g><path class="wire dash" marker-end="url(#arrow)" d="M108 482V574"/><g transform="translate(24 582)"><rect class="cell" width="168" height="88"/><text class="small mute" x="156" y="22" text-anchor="end">OPTIONAL</text><text class="label" x="14" y="43">HUMAN REVIEW</text><text class="copy mute" x="14" y="68">keep local or sync</text></g><path class="wire dash" marker-end="url(#arrow)" d="M108 670V730"/><g transform="translate(24 738)"><rect class="cell" width="168" height="88"/><text class="label" x="14" y="43">SYNC</text><text class="copy mute" x="14" y="68">generic change only</text></g><path class="wire dash" marker-end="url(#arrow)" d="M192 782H212"/><g transform="translate(220 738)"><rect class="cell" width="146" height="88"/><text class="label" x="14" y="43">FUTURE REPOS</text><text class="copy mute" x="14" y="68">start stronger</text></g><text class="small mute" x="24" y="872">SOLID: LOCAL LOOP</text><text class="small mute" x="24" y="902">DOTTED: HUMAN-GATED SYNC</text><text class="small mute" x="24" y="956">KEEP LOCAL remains the default.</text><circle class="signal feedback-pulse" cx="0" cy="0" r="7"/>
</svg>
