<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Recall, work, verify, refine, and a reviewed repository change form a local loop. A separate human-approved sync can carry generic changes into future repositories.">
<title>Harness Firmware feedback circuit</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}.ink{fill:#1f2328}.mute{fill:#59636e}.accent{fill:#1a7f37}.soft{fill:#dafbe1}.panel{fill:none;stroke:#d1d9e0;stroke-width:1}.wire{fill:none;stroke:#d1d9e0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wire.active{stroke:#1a7f37}.dash{stroke-dasharray:7 7}.tag{fill:#dafbe1;stroke:#1a7f37;stroke-width:1}.cell{fill:none;stroke:#d1d9e0;stroke-width:1}.grid{stroke:#d1d9e0;stroke-width:1;opacity:.28}.signal{fill:#1a7f37;stroke:#1a7f37}.evidence{fill:#dafbe1;stroke:#1f2328;stroke-width:1}.eyebrow{font:600 12px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.8px}.headline{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:-1.5px}.subhead{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.label{font:700 13px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.7px}.copy{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.small{font:500 12px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.25px}.count{font:700 34px ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes scanY{0%{transform:translateY(0)}92%,100%{transform:translateY(var(--scan-distance))}}

@keyframes feedbackPulse{0.00%,15.67%{transform:translate(150px,206px)}16.67%,32.33%{transform:translate(410px,206px)}33.33%,49.00%{transform:translate(670px,206px)}50.00%,65.67%{transform:translate(670px,374px)}66.67%,82.33%{transform:translate(410px,374px)}83.33%,99.00%{transform:translate(150px,374px)}}.feedback-pulse{animation:feedbackPulse 12s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.feedback-pulse,.scan-bar,.boot-cursor,.runtime-packet{display:none!important}.boot-ready{opacity:1!important}}
</style>
<g aria-hidden="true"><path class="grid" d="M44 0V560"/><path class="grid" d="M88 0V560"/><path class="grid" d="M132 0V560"/><path class="grid" d="M176 0V560"/><path class="grid" d="M220 0V560"/><path class="grid" d="M264 0V560"/><path class="grid" d="M308 0V560"/><path class="grid" d="M352 0V560"/><path class="grid" d="M396 0V560"/><path class="grid" d="M440 0V560"/><path class="grid" d="M484 0V560"/><path class="grid" d="M528 0V560"/><path class="grid" d="M572 0V560"/><path class="grid" d="M616 0V560"/><path class="grid" d="M660 0V560"/><path class="grid" d="M704 0V560"/><path class="grid" d="M748 0V560"/><path class="grid" d="M792 0V560"/><path class="grid" d="M836 0V560"/><path class="grid" d="M0 44H880"/><path class="grid" d="M0 88H880"/><path class="grid" d="M0 132H880"/><path class="grid" d="M0 176H880"/><path class="grid" d="M0 220H880"/><path class="grid" d="M0 264H880"/><path class="grid" d="M0 308H880"/><path class="grid" d="M0 352H880"/><path class="grid" d="M0 396H880"/><path class="grid" d="M0 440H880"/><path class="grid" d="M0 484H880"/><path class="grid" d="M0 528H880"/></g><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d1d9e0"/></marker></defs><text class="eyebrow mute" x="40" y="42">THE FEEDBACK CIRCUIT</text><text class="headline" x="40" y="94" style="font-size:42px">Verified lessons improve the next task.</text><text class="subhead mute" x="40" y="124">Propagation stays optional and human-reviewed.</text><path class="wire" marker-end="url(#arrow)" d="M150 206H401"/><path class="wire" marker-end="url(#arrow)" d="M410 206V206H661"/><path class="wire" marker-end="url(#arrow)" d="M670 206H661"/><path class="wire" marker-end="url(#arrow)" d="M670 374V374H419"/><path class="wire" marker-end="url(#arrow)" d="M410 374H141"/><path class="wire" marker-end="url(#arrow)" d="M150 374H20V138H150V198"/><g transform="translate(40 158)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">01</text><text class="label" x="14" y="43">RECALL</text><text class="copy mute" x="14" y="72">load repo facts</text></g><g transform="translate(300 158)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">02</text><text class="label" x="14" y="43">WORK</text><text class="copy mute" x="14" y="72">use routed playbook</text></g><g transform="translate(560 158)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">03</text><text class="label" x="14" y="43">VERIFY</text><text class="copy mute" x="14" y="72">capture evidence</text></g><g transform="translate(560 326)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">04</text><text class="label" x="14" y="43">REFINE</text><text class="copy mute" x="14" y="72">turn friction into a fix</text></g><g transform="translate(300 326)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">05</text><text class="label" x="14" y="43">REVIEWED CHANGE</text><text class="copy mute" x="14" y="72">commit useful lesson</text></g><g transform="translate(40 326)"><rect class="cell" width="220" height="96"/><text class="small mute" x="208" y="22" text-anchor="end">06</text><text class="label" x="14" y="43">NEXT TASK</text><text class="copy mute" x="14" y="72">recall stronger repo</text></g><g transform="translate(616 270)"><rect class="evidence" width="132" height="30"/><path class="wire active" d="M10 15l7 7 13-15"/><text class="small" x="40" y="20">EVIDENCE</text></g><path class="wire dash" marker-end="url(#arrow)" d="M410 422V484H518"/><g transform="translate(526 446)"><rect class="cell" width="142" height="70"/><text class="small mute" x="12" y="21">OPTIONAL GATE</text><text class="label" x="12" y="45">HUMAN REVIEW</text><text class="small mute" x="12" y="62">KEEP LOCAL / SYNC</text></g><path class="wire dash" marker-end="url(#arrow)" d="M668 481H698"/><g transform="translate(706 446)"><rect class="cell" width="134" height="70"/><text class="label" x="12" y="31">FUTURE REPOS</text><text class="small mute" x="12" y="53">generic changes only</text></g><text class="small mute" x="40" y="530">SOLID: LOCAL LOOP · DOTTED: HUMAN-GATED SYNC</text><circle class="signal feedback-pulse" cx="0" cy="0" r="7"/>
</svg>
